# Render Blueprint — provisions a Postgres database + the FastAPI backend.
# In Render: New → Blueprint → connect this repo. Everything below is auto-applied.
databases:
  - name: constructai-db
    plan: free

services:
  - type: web
    name: constructai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrate, seed demo data (only if the DB is empty), then serve.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: constructai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Allow the Vercel frontend (production + preview URLs) to call the API.
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
