name: Keep backend warm

# Render's free web service sleeps after ~15 min idle (cold start ~30-50s on the
# next request). This pings /health every 10 minutes to keep it awake during the
# day. Set a repo secret BACKEND_URL = https://<your-service>.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 50 "${{ secrets.BACKEND_URL }}/health" \
            && echo " — backend is awake" \
            || echo "ping failed (the backend may be waking up)"
